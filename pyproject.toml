[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tuxagent"
description = "Локальный русскоязычный ИИ-агент для Linux"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version", "dependencies"]

[project.scripts]
tuxagent = "app:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "agent",
    "app",
    "audit",
    "chat_store",
    "config",
    "distro",
    "llm",
    "logging_setup",
    "main_window",
    "package_managers",
    "safety",
    "settings_dialog",
    "tools",
    "version",
]

[tool.setuptools.dynamic]
version = {attr = "version.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = [
    "agent",
    "app",
    "audit",
    "chat_store",
    "config",
    "distro",
    "llm",
    "logging_setup",
    "main_window",
    "package_managers",
    "safety",
    "settings_dialog",
    "tools",
    "version",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
qt_api = "pyqt6"
markers = [
    "gui: тесты, требующие Qt-приложения",
    "slow: долгие тесты",
]
